# Utrecht Funding & Deadlines — the single source of truth.
# Rules: rules/funding-rules.md. Vocabularies: data/taxonomy.yaml. Check: npm run validate.
#
# Field guide (short):
#   id            stable, lowercase-hyphenated; never reuse an id for a different scheme
#   url           the funder's own page for this call — never an aggregator
#   areas         broad UH areas, or [any] for all disciplines
#   stages        research | valorisation | transition | venture
#   flags         specific topics (oncology, atmp, ...) — as many as apply
#   eligibility   applicants, requires, years_post_phd {min,max}, max_age,
#                 max_company_age_years, gender: women, and `utrecht` (required, free text)
#   deadlines     date (YYYY-MM-DD), time (HH:MM), tz, label, invite_only
#   rolling       true when you can apply at any time (with rolling_note)
#   next_round    when no date is confirmed yet: what is expected, and from what evidence
#   source_quote  the deadline sentence copied from the funder's page
#   last_verified the date someone last checked the funder's page

opportunities:

