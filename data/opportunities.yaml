  summary: >-
    Subsidy for a feasibility project that comes before a technically or financially risky R&D project
    leading to an innovative product, production process or service. At least 60% of the project is a
    feasibility study (literature and patent search, inventory of technology and potential partners,
    market exploration, competition analysis); the rest can be industrial research or experimental
    development. Projects last at most one year and must start within four months of the grant.
  amount: "35% of eligible costs, up to €20,000"
  areas: [any]
  stages: [valorisation, transition]
  flags: []
  funding_type: grant
  eligibility:
    applicants: [startup, sme]
    requires: [nl-company]
    utrecht: >-
      SMEs established in the province of Utrecht (with a visiting address there in the Chamber of
      Commerce register). The project must contribute to both the Regional Economic Agenda (REA) of the
